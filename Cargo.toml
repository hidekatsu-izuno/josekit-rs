[package]
name = "josekit"
version = "0.11.0"
description = "JOSE (Javascript Object Signing and Encryption) library for Rust."
repository = "https://github.com/hidekatsu-izuno/josekit-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Hidekatsu Izuno <hidekatsu.izuno@gmail.com>"]
keywords = ["jose", "jwt", "jws", "jwe", "jwa"]
categories = ["authentication"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# default = ["openssl", "pqc"]
legacy-crypto = ["rsa-sha1"]
rsa-sha1 = []
default = ["rustcrypto", "pqc", "legacy-crypto"]
kapun-provider = ["dep:kapun-crypto-provider"]
vendored = ["openssl/vendored"]
rustcrypto = [
    "aes",
    "aes-gcm",
    "aes-kw",
    "cbc",
    "p256",
    "p384",
    "p521",
    "k256",
    "ed25519-dalek",
    "x25519-dalek",
    "cx448",
    "sha2",
    "sha1",
    "pbkdf2",
    "rsa",
    "hmac",
    "rand",
    "pem",
]
pqc = ["dep:ml-dsa", "rand", "pem", "dep:base64ct"]
pem = ["dep:pem"]

[dependencies]
kapun-crypto-provider = { git = "https://github.com/KapunSDK/kapun-sdk.git", default-features = false, optional = true }
ml-dsa = {version = "0.1.1", features = ["pkcs8"], optional = true}
x25519-dalek = { version = "2.0.1", features = [
    "static_secrets",
], optional = true }
cx448 = { version = "0.1.1", features = ["pkcs8"], optional = true }
thiserror = "2"
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
flate2 = "1"
time = "0.3"
openssl = { version = "0.10.68", optional = true }
aes-gcm = { version = "0.10.3", optional = true }
aes-kw = { version = "0.2.1", optional = true }
p256 = { version = "0.13.2", features = [
    "pkcs8",
    "jwk",
    "ecdh",
    "ecdsa",
], optional = true }
p384 = { version = "0.13.1", features = [
    "pkcs8",
    "jwk",
    "ecdh",
    "ecdsa",
], optional = true }
p521 = { version = "0.13.3", features = [
    "pkcs8",
    "jwk",
    "ecdh",
    "ecdsa",
], optional = true }
k256 = { version = "0.13.4", features = [
    "jwk",
    "ecdh",
    "ecdsa",
], optional = true }
sha2 = { version = "0.11.0-rc.3", optional = true }
sha1 = { version = "0.11.0-rc.3", optional = true }
pbkdf2 = { version = "0.13.0-rc.5", optional = true }
rsa = { version = "0.10.0-rc.18", optional = true, features = [
    "pkcs5",
    "sha2",
    "sha1",
] }
signature = "3.0.0"
crypto-bigint = "^0.7"
crypto-primes = "=0.7.0"
pkcs1 = "=0.8.0-rc.4"
spki = { version = "=0.8.0", features = ["pem"]}
cbc = { version = "0.1.2", features = ["alloc"], optional = true }
aes = { version = "0.8.4", optional = true }
hmac = { version = "0.13.0-rc.3", optional = true }
ed25519-dalek = { version = "3.0.0", features = [
    "rand_core",
    "digest",
], optional = true }
rand = { version = "^0.10", optional = true }
pem = { version = "3.0.5", optional = true }
der = {  version = "0.8.0" }
base64ct = { version = "1.8.3", optional = true }
pkcs8 = { version = "0.11.0", features = ["pem"] }

[target.'cfg(target = "wasm32-unknown-unknow")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_new = { version = "0.3", features = [
    "wasm_js",
], package = "getrandom" }

[dev-dependencies]
doc-comment = "0.3.3"
