[package]
name = "josekit"
version = "0.11.0"
description = "JOSE (Javascript Object Signing and Encryption) library for Rust."
repository = "https://github.com/hidekatsu-izuno/josekit-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Hidekatsu Izuno <hidekatsu.izuno@gmail.com>"]
keywords = ["jose", "jwt", "jws", "jwe", "jwa"]
categories = ["authentication"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["openssl"]
openssl = ["dep:openssl"]
aes-kw-rustcrypto = ["dep:aes-kw", "dep:rand"]
aes-cbc-hmac-rustcrypto = ["dep:aes", "dep:cbc", "dep:hmac", "dep:rand", "dep:sha2", "dep:subtle"]
aes-gcm-rustcrypto = ["dep:aes-gcm", "dep:rand"]
ec-rustcrypto = ["dep:k256", "dep:p256", "dep:p384", "dep:p521", "dep:rand", "dep:sha2"]
ed25519-dalek = ["dep:ed25519-dalek", "dep:pkcs8", "dep:zeroize"]
hmac-rustcrypto = ["dep:hmac", "dep:rand", "dep:sha2", "dep:subtle", "dep:zeroize"]
pbkdf2-rustcrypto = ["dep:pbkdf2", "dep:rand", "dep:sha2"]
rsa-rustcrypto = ["dep:rand", "dep:rsa", "dep:sha1", "dep:sha2"]
x25519-dalek = ["dep:x25519-dalek", "dep:pkcs8", "dep:sha2", "dep:zeroize"]

ed448-goldilocks-plus = [
    "dep:ed448-goldilocks-plus",
    "ed448-goldilocks-plus/signing",
    "dep:pkcs8",
    "dep:zeroize",
]
x448-goldilocks-plus = [
    "dep:ed448-goldilocks-plus",
    "ed448-goldilocks-plus/kex",
    "dep:pkcs8",
    "aes-kw-rustcrypto",
    "dep:sha2",
    "dep:zeroize",
]
vendored = ["openssl", "openssl/vendored"]

[dependencies]
thiserror = "2"
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
flate2 = "1"
time = "0.3"
openssl = { version = "0.10.68", optional = true }
aes = { version = "0.9", optional = true }
aes-gcm = { version = "0.11", default-features = false, features = ["aes"], optional = true }
aes-kw = { version = "0.3.1", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
ed25519-dalek = { version = "3", optional = true }
ed448-goldilocks-plus = { version = "0.18.1", default-features = false, optional = true }
hmac = { version = "0.13", optional = true }
k256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"], optional = true }
p521 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"], optional = true }
pbkdf2 = { version = "0.13", optional = true }
pkcs8 = { version = "0.11", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"], optional = true }
rsa = { version = "0.10", default-features = false, features = ["encoding", "pkcs1v15"], optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
subtle = { version = "2", optional = true }
x25519-dalek = { version = "3", features = ["static_secrets"], optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
doc-comment = "0.3.3"
