name: Rust

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pure-rust, openssl, libressl, aws-lc, wasm-wasi]
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install WASI target
        if: matrix.backend == 'wasm-wasi'
        run: rustup target add wasm32-wasip1

      - name: Build LibreSSL
        if: matrix.backend == 'libressl'
        working-directory: ${{ runner.temp }}
        run: |
          version=4.4.1
          archive="libressl-$version.tar.gz"
          prefix="$RUNNER_TEMP/libressl"
          curl --fail --silent --show-error --location --retry 3 \
            "https://cdn.openbsd.org/pub/OpenBSD/LibreSSL/$archive" --output "$archive"
          printf '%s  %s\n' '290cdf1b53c086255dc302f118b98602a444e9ae6d11e9bfdd8c9b1b60aa3a22' "$archive" | sha256sum --check
          tar -xzf "$archive"
          cd "libressl-$version"
          ./configure --prefix="$prefix" --disable-shared --disable-tests
          make -j "$(nproc)"
          make install
          printf 'LIBRESSL_DIR=%s\nOPENSSL_STATIC=1\n' "$prefix" >> "$GITHUB_ENV"

      - name: Test
        run: ./scripts/test-backends.sh ${{ matrix.backend }} ${{ matrix.backend == 'wasm-wasi' && '--release' || '' }}
